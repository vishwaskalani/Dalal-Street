name: Refresh delivery data

# NSE publishes the day's delivery bhavcopy well after the 15:30 IST close.
# 19:30 IST = 14:00 UTC, Mon–Sat (Saturday catches a Friday file that landed late).
on:
  schedule:
    - cron: "0 14 * * 1-6"
  workflow_dispatch:        # lets you refresh on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-delivery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas requests

      - name: Rebuild snapshot
        working-directory: delivery-momentum
        run: python refresh.py --days 30

      - name: Commit if changed
        run: |
          if git diff --quiet -- delivery-momentum/data; then
            echo "No change in snapshot — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add delivery-momentum/data
          git commit -m "chore: refresh NSE delivery snapshot"
          git push
